name: Check Cloudflare connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check resource access without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --use-env-proxy --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if (!token || !/^[a-f0-9]{32}$/i.test(account || '')) {
            console.error('Missing token or invalid account ID format. Expected 32 hexadecimal characters for Account ID.');
            process.exit(1);
          }
          for (const [label, path] of [
            ['Workers', 'workers/scripts'],
            ['D1', 'd1/database'],
            ['R2', 'r2/buckets'],
            ['Workers subdomain', 'workers/subdomain'],
          ]) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/${path}`, {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(30000),
              });
              const data = await response.json();
              console.log(`${label}: HTTP ${response.status}; success=${data.success === true}; codes=${(data.errors || []).map(e => e.code).join(',')}`);
              if (!response.ok || !data.success) { process.exitCode = 1; continue; }
              if (label === 'D1') {
                const found = data.result?.find(item => item.name === 'citytreeclub-junior');
                console.log(`Project D1 database: ${found ? 'exists' : 'not created'}`);
              }
              if (label === 'R2') console.log(`Project photo bucket: ${data.result?.buckets?.some(item => item.name === 'citytreeclub-junior-photos') ? 'exists' : 'not created'}`);
              if (label === 'Workers subdomain') console.log(`Workers subdomain configured: ${Boolean(data.result?.subdomain)}`);
            } catch {
              console.error(`${label}: network or response parsing failed (credentials omitted)`);
              process.exitCode = 1;
            }
          }
          JS
